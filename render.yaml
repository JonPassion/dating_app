# Render Blueprint — free tier
# Deploy: connect repo at https://dashboard.render.com → New → Blueprint
databases:
  - name: unidate-db
    plan: free
    databaseName: unidate
    user: unidate

services:
  - type: web
    name: unidate
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd datingsite && gunicorn datingsite.wsgi:application -c ../gunicorn.conf.py
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: GUNICORN_THREADS
        value: 2
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: unidate-db
          property: connectionString
      - key: RENDER
        value: true
